[project]
name = "yantrabodha-mcp"
version = "0.1.0"
description = "MCP server for the Yantrabodha AI agent knowledge base"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yantrabodha Contributors" }]
keywords = ["mcp", "model-context-protocol", "yantrabodha", "ai", "knowledge-base"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/utsaaham/yantrabodha"
Repository = "https://github.com/utsaaham/yantrabodha"
Documentation = "https://github.com/utsaaham/yantrabodha#readme"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
yantrabodha-mcp = "yantrabodha_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yantrabodha_mcp"]
